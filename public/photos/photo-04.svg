<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Warm golden coastline before sunset with gentle waves">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9A88F"/>
      <stop offset="55%" stop-color="#F2CFA7"/>
      <stop offset="100%" stop-color="#FAE5C8"/>
    </linearGradient>
    <linearGradient id="sea4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B8783"/>
      <stop offset="100%" stop-color="#9CB3AC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="310" fill="url(#sky4)"/>
  <!-- Sun -->
  <circle cx="305" cy="215" r="56" fill="#FFF7DF" opacity="0.92"/>
  <ellipse cx="305" cy="272" rx="115" ry="12" fill="#FFF0C8" opacity="0.4"/>
  <!-- Sea -->
  <rect y="272" width="600" height="128" fill="url(#sea4)"/>
  <path d="M220,295 L390,295 M250,318 L360,318 M275,342 L335,342" stroke="#F8E3BD" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Shore & Sand -->
  <path d="M0,390 Q195,358 380,384 T600,372 L600,520 L0,520 Z" fill="#EBD7BE"/>
  <path d="M0,388 Q195,356 380,382 T600,370" fill="none" stroke="#FFFDF9" stroke-width="6" opacity="0.72"/>
  <!-- Silhouetted couple walking far away -->
  <g fill="#453236">
    <circle cx="278" cy="364" r="5.5"/>
    <path d="M272,371 L284,371 L286,404 L270,404 Z"/>
    <circle cx="298" cy="367" r="5"/>
    <path d="M292,374 L303,374 L305,404 L291,404 Z"/>
  </g>
  <!-- Small seashells -->
  <circle cx="145" cy="452" r="5" fill="#C44D67" opacity="0.65"/>
  <circle cx="430" cy="466" r="4" fill="#A57F68" opacity="0.65"/>
  <!-- Seabirds -->
  <path d="M138,118 Q146,110 154,118 Q162,110 170,118" fill="none" stroke="#6E4E4A" stroke-width="2" stroke-linecap="round"/>
  <path d="M188,138 Q194,132 200,138 Q206,132 212,138" fill="none" stroke="#6E4E4A" stroke-width="1.8" stroke-linecap="round"/>
</svg>

