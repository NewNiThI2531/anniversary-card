<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Dusk skyline viewed through a warm train window">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E2D36"/>
      <stop offset="48%" stop-color="#9A5362"/>
      <stop offset="82%" stop-color="#DF9A7C"/>
      <stop offset="100%" stop-color="#F2CFA7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="520" fill="#2E2226"/>
  <!-- Window opening -->
  <rect x="46" y="42" width="508" height="410" rx="24" fill="url(#sky2)"/>
  <!-- Moon -->
  <circle cx="445" cy="118" r="22" fill="#FFF5E6" opacity="0.9"/>
  <!-- Distant hills -->
  <path d="M46,320 Q175,268 300,305 T554,288 L554,452 L46,452 Z" fill="#5B3F49" opacity="0.72"/>
  <path d="M46,356 Q210,322 365,358 T554,344 L554,452 L46,452 Z" fill="#3B2930"/>
  <!-- Tiny warm city lights -->
  <g fill="#FFE2A8" opacity="0.85">
    <circle cx="118" cy="368" r="3"/><circle cx="132" cy="372" r="2.5"/><circle cx="152" cy="366" r="3"/>
    <circle cx="240" cy="360" r="2.5"/><circle cx="256" cy="364" r="3"/><circle cx="272" cy="358" r="2"/>
    <circle cx="408" cy="364" r="3"/><circle cx="424" cy="368" r="2.5"/><circle cx="442" cy="361" r="3"/>
  </g>
  <!-- Power lines -->
  <path d="M46,245 Q280,292 554,225" fill="none" stroke="#2B2023" stroke-width="2" opacity="0.65"/>
  <path d="M46,268 Q290,312 554,248" fill="none" stroke="#2B2023" stroke-width="1.5" opacity="0.5"/>
  <!-- Window sill and reflection -->
  <rect x="46" y="42" width="508" height="410" rx="24" fill="none" stroke="#4D3B41" stroke-width="10"/>
  <polygon points="90,42 150,42 75,452 46,452 46,280" fill="#FFFDF9" opacity="0.08"/>
  <rect x="28" y="450" width="544" height="30" rx="6" fill="#513D43"/>
  <!-- Ticket stub on sill -->
  <polygon points="390,432 485,422 492,456 396,466" fill="#FAF2E4" stroke="#D3C0AA" stroke-width="1.5"/>
  <line x1="406" y1="442" x2="466" y2="436" stroke="#C44D67" stroke-width="2"/>
</svg>

