<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="First apartment moving boxes and a potted plant in morning sunlight">
  <rect width="600" height="365" fill="#F5EDE1"/>
  <rect y="365" width="600" height="155" fill="#D5B899"/>
  <!-- Sunlight patch -->
  <polygon points="340,0 600,0 600,480 180,480" fill="#FFFDF9" opacity="0.34"/>
  <!-- Framed art leaning against wall -->
  <rect x="78" y="218" width="124" height="152" rx="4" fill="#7D6152"/>
  <rect x="90" y="230" width="100" height="128" fill="#FAF5EE"/>
  <circle cx="140" cy="285" r="24" fill="#C44D67" opacity="0.82"/>
  <path d="M108,332 Q140,304 172,332" fill="none" stroke="#5F7560" stroke-width="4"/>
  <!-- Moving Box 1 -->
  <rect x="215" y="255" width="175" height="135" fill="#C69C72" stroke="#9F7852" stroke-width="2"/>
  <rect x="215" y="255" width="175" height="24" fill="#B58960"/>
  <rect x="292" y="255" width="22" height="65" fill="#E8D7BC" opacity="0.85"/>
  <!-- Handwritten marker label -->
  <rect x="242" y="308" width="84" height="36" fill="#FFFDF9" transform="rotate(-3 284 326)"/>
  <line x1="254" y1="322" x2="314" y2="319" stroke="#2B2023" stroke-width="2.5"/>
  <line x1="254" y1="333" x2="298" y2="331" stroke="#8C6E63" stroke-width="2"/>
  <!-- Moving Box 2 -->
  <rect x="360" y="295" width="142" height="118" fill="#D4AC82" stroke="#A67E56" stroke-width="2"/>
  <rect x="422" y="295" width="20" height="52" fill="#E8D7BC" opacity="0.85"/>
  <!-- Potted olive tree -->
  <path d="M446,245 L498,245 L490,295 L454,295 Z" fill="#B86B57"/>
  <line x1="472" y1="245" x2="472" y2="142" stroke="#6E5748" stroke-width="4"/>
  <ellipse cx="452" cy="175" rx="18" ry="8" transform="rotate(-28 452 175)" fill="#6C826D"/>
  <ellipse cx="492" cy="168" rx="18" ry="8" transform="rotate(24 492 168)" fill="#7D947E"/>
  <ellipse cx="456" cy="144" rx="16" ry="7" transform="rotate(-18 456 144)" fill="#7D947E"/>
  <ellipse cx="486" cy="138" rx="16" ry="7" transform="rotate(20 486 138)" fill="#5F7560"/>
</svg>

